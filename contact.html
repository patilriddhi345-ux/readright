<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Contact – Read Right</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">

<style>
*{ box-sizing:border-box; }

html,body{
    height:100%;
}

body{
    margin:0;
    font-family:"Segoe UI",Arial,sans-serif;
    overflow-x:hidden;
    opacity:0;
    transition:.6s;
    display:flex;
    flex-direction:column;
}
body.loaded{opacity:1;}

/* === BACKGROUND (SAME) === */
.bg-anim{
    position:fixed;
    inset:0;
    background:url("https://images.unsplash.com/photo-1507842217343-583bb7270b66") center/cover no-repeat;
    z-index:-2;
    animation:bgMove 20s linear infinite;
}
@keyframes bgMove{
    0%{background-position:center top;}
    100%{background-position:center bottom;}
}

.bg-overlay{
    position:fixed;
    inset:0;
    background:linear-gradient(rgba(227,242,253,.8), rgba(95,111,128,.8));
    z-index:-1;
}

/* === HEADER === */
header{
    background:linear-gradient(90deg,#0d47a1,#1976d2);
    color:white;
    text-align:center;
    padding:22px 15px 30px;
    box-shadow:0 6px 20px rgba(0,0,0,.25);
}

h1{
    font-family:'Cinzel',serif;
    font-size:38px;
    background:linear-gradient(90deg,#b6a3bb,#919633,#37d39f,#1976d2);
    background-size:300%;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:titleFlow 6s linear infinite;
}
@keyframes titleFlow{
    0%{background-position:0%}
    100%{background-position:300%}
}

.back-home{
    color:#ffe082;
    text-decoration:none;
    font-weight:bold;
}

/* === MAIN PAGE AREA === */
main{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* === CONTAINER === */
.container{
     max-width:640px;
    width:100%;
    padding:34px;
    border-radius:26px;

    /* BLUE CONTAINER */
    background:linear-gradient(135deg,#0d47a1,#1976d2,#1565c0);

    box-shadow:
        0 50px 100px rgba(13,71,161,.55),
        inset 0 0 0 2px rgba(255,255,255,.15);
}

/* === CARD === */
.card-wrapper{
    perspective:1600px;
    animation:floatCard 5s ease-in-out infinite;
}
@keyframes floatCard{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-10px);}
}

.flip-card{
    position:relative;
    width:100%;
    height:280px;
    transform-style:preserve-3d;
    transition:transform .65s cubic-bezier(.4,.2,.2,1);
    cursor:pointer;
    will-change:transform;
}
.card-wrapper:hover .flip-card{
    transition:transform .25s ease-out;
}
.flip-card.flipped{
    transform:rotateY(180deg);
}

.card-face{
    position:absolute;
    inset:0;
    display:grid;
    gap:22px;
    padding:34px;
    border-radius:26px;
    backface-visibility:hidden;

    /* GLASS WHITE PREMIUM */
    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.88),
            rgba(240,247,255,.82)
        );

    backdrop-filter: blur(14px) saturate(160%);
    -webkit-backdrop-filter: blur(14px) saturate(160%);

    box-shadow:
        0 30px 70px rgba(13,71,161,.35),
        inset 0 0 0 1px rgba(255,255,255,.65),
        inset 0 0 25px rgba(187,222,251,.55);
}
.card-face::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:45%;
    border-radius:26px 26px 60px 60px;
    background:linear-gradient(
        180deg,
        rgba(255,255,255,.65),
        rgba(255,255,255,0)
    );
    pointer-events:none;
}
.card-title{
     color:#0d47a1;
    font-weight:700;
    font-size:1.2rem;
}

.card-desc{
     color:#1f2937;
    font-size:.95rem;
    line-height:1.5;
}
.card-front{
    grid-template-columns:140px 1fr 120px;
    align-items:start;
}

.card-back{
    transform:rotateY(180deg);
    grid-template-columns:1fr 160px;
}

/* PHOTO */
.card-photo{
    display:flex;
    justify-content:center;
    padding-top:20px;   
}
.card-photo img{
    position:relative; 
    margin-top: -10px;  
    width:110px;
    height:110px;
    border-radius:50%;
    object-position: 50% 20%;
    object-fit:cover;
    border:3px solid rgba(255,255,255,.45);
    box-shadow:0 14px 35px rgba(0,0,0,.6);
    background:#fff;
    outline:3px solid rgba(255,255,255,.15);
    outline-offset:6px;
}

@media(max-width:700px){
    .card-photo img{
        transform:translateY(-10px);
    }
}
/* INFO */
.card-info h3{
    color:#0d47a1;
    font-weight:700;
    text-shadow:none;
    letter-spacing:.6px;
}
.card-info p{
     color:#1f2937;
    display:flex;
    align-items:center;
    gap:8px;
}
.card-info i{
    color:#1976d2;
    font-size:1.05rem;
}
/* QR */
.card-qr{
    text-align:center;
}
.card-qr .qr-box{
    width:112px;
    height:112px;
    border-radius:20px;
    background:linear-gradient(145deg,#e3f2fd,#bbdefb);
    color:#0d47a1;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    color:#fff;
    letter-spacing:1px;
}
.card-qr img{
    width:92%;
    height:92%;
    object-fit:cover;
    border-radius:14px;
}
.card-qr small{
    color:#1565c0;
    font-weight:600;
    margin-top:6px;
    display:block;
}

/* === FOOTER (BOTTOM FIXED) === */
footer{
    background:linear-gradient(90deg,#0d47a1,#1976d2);
    color:#e3f2fd;
    text-align:center;
    padding:14px 10px;
    font-size:.9rem;
    box-shadow:0 -6px 18px rgba(0,0,0,.35);
}

/* MOBILE */
@media(max-width:700px){
    .flip-card{height:auto;}

    .card-front,
    .card-back{
        grid-template-columns:1fr;
        text-align:center;
        gap:18px;
    }

    .card-info p{
        justify-content:center;
    }

    .card-qr{
        margin:auto;
    }
}
</style>
</head>

<body>
<div class="bg-anim"></div>
<div class="bg-overlay"></div>

<header>
    <h1><i class="fa-solid fa-address-card"></i> Contact</h1>
    <a href="index.html" class="back-home">← Back to Home</a>
</header>

<main>
    <div class="container">
        <div class="card-wrapper">
            <div class="flip-card" onclick="this.classList.toggle('flipped')">

                <div class="card-face card-front">
                    <div class="card-photo">
                        <img src="photo.jpeg" alt="Image">
                    </div>

                    <div class="card-info">
                        <h3>Riddhi Patil</h3>
                        <p><i class="fa-solid fa-phone"></i>+91 3475782923</p>
                        <p><i class="fa-solid fa-location-dot"></i>Maharashtra, India</p>
                        <p><i class="fa-solid fa-envelope"></i> patilriddhi345@gmail.com</p>
                    </div>

                    <div class="card-qr">
                        <div class="qr-box">TAP</div>
                        <small>Tap to Flip</small>
                    </div>
                </div>

                <div class="card-face card-back">
                    <div>
                        <h4 class="card-title">Connect Instantly</h4>
<p class="card-desc">Scan the QR code to access my digital profile.</p>
                    </div>

                    <div class="card-qr">
                        <div class="qr-box">
                            <img src="qr.png" alt="QR Code">
                        </div>
                        <small>Scan to Connect</small>
                    </div>
                </div>

            </div>
        </div>
    </div>
</main>

<footer>
    © 2026 Read Right | Student Awareness Project
</footer>

<script>
const card = document.querySelector('.flip-card');

card.addEventListener('mousemove', e => {
    const rect = card.getBoundingClientRect();
    const x = e.clientX - rect.left - rect.width / 2;
    const y = e.clientY - rect.top - rect.height / 2;

    const flip = card.classList.contains('flipped') ? 180 : 0;

   card.style.transform =
 `rotateY(${flip}deg)
  rotateX(${ -y / 25 }deg)
  rotateZ(${ x / 40 }deg)`;

});

card.addEventListener('mouseleave', () => {
    const flip = card.classList.contains('flipped') ? 180 : 0;
    card.style.transform = `rotateY(${flip}deg)`;
});
</script>
<script>
window.addEventListener("load", () => {
    document.body.classList.add("loaded");
});
</script>
</body>
</html>
