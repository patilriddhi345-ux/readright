<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Media Gallery – Read Right</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

/* ===== BODY + BACKGROUND ===== */
body{
    margin:0;
    font-family:"Segoe UI", Arial, sans-serif;
    background:
      linear-gradient(rgba(227,242,253,0.85),rgba(95,111,128,0.85)),
      url("https://images.unsplash.com/photo-1507842217343-583bb7270b66");
    background-size:cover;
    background-attachment:fixed;
    animation:bgMove 18s ease-in-out infinite;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    opacity:0;
    transition:.6s;
}
body.loaded{opacity:1}

@keyframes bgMove{
    0%{background-position:0% 0%}
    50%{background-position:50% 50%}
    100%{background-position:100% 100%}
}

/* ===== HEADER ===== */
header{
    background:linear-gradient(90deg,#0d47a1,#1976d2);
    color:white;
    text-align:center;
    padding:22px 15px 30px;
    box-shadow:0 6px 20px rgba(0,0,0,.25);
}

h1{
    font-family:'Cinzel', serif;
    font-size:38px;
    background:linear-gradient(90deg,#b6a3bb,#919633,#37d39f,#1976d2);
    background-size:300%;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:titleMove 6s linear infinite;
}
@keyframes titleMove{
    0%{background-position:0%}
    100%{background-position:300%}
}

.back-home{
    color:#ffeb3b;
    text-decoration:none;
    font-weight:bold;
}

/* ===== SUBMENU ===== */
.submenu{
    display:flex;
    justify-content:center;
    gap:18px;
    margin:30px auto;
    flex-wrap:wrap;
    max-width:800px;
}

.submenu button{
    border:none;
    padding:14px 28px;
    border-radius:30px;
    background:white;
    color:#0d47a1;
    font-weight:bold;
    cursor:pointer;
    transition:.4s;
}

.submenu button:hover{
    transform:translateY(-5px);
    background:#ffeb3b;
}

.submenu button.active{
    background:linear-gradient(135deg,#0d47a1,#1976d2);
    color:white;
    box-shadow:0 12px 28px rgba(13,71,161,.35);
}

/* ===== SECTIONS ===== */
.section{
    display:none;
    padding:40px;
    border-radius:20px;
    background:
      linear-gradient(rgba(255,255,255,.9),rgba(255,255,255,.9)),
      url("https://images.unsplash.com/photo-1524995997946-a1c2e315a42f");
    background-size:cover;
    max-width:900px;
    width:90%;
    margin:0 auto 40px;
    box-shadow:0 30px 60px rgba(0,0,0,.35);
}

.section.pop{
    animation:pop .9s ease;
}
@keyframes pop{
    from{transform:translateY(-30px);opacity:0}
    to{transform:translateY(0);opacity:1}
}

h2{color:#0d47a1}

/* ===== SLIDESHOW (FADE + SLIDE + DOTS) ===== */
.slideshow{
    position:relative;
    width:100%;
    max-width:860px;
    height:400px;
    margin:25px auto;
    overflow:hidden;
    border-radius:20px;
    box-shadow:0 30px 70px rgba(0,0,0,.4);
    background:#000;
}
#info .slide{
    object-fit: contain;          
    background:#ffffff;          
    padding:18px;
}
#info .slideshow{
    height:520px;
    background:#fdfdfd;
}
.slide{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:0;
    transform:translateX(60px) scale(1.08);
    transition:
        opacity .6s ease,
        transform .7s ease;
}

.slide.active{
    opacity:1;
    transform:scale(1);
}
#poster .slide{
    object-fit: contain;
    background:#fff;   
}
#poster .slideshow{
    height:520px;
}
/* === DOTS === */
.dots{
    position:absolute;
    bottom:16px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:10px;
    z-index:5;
}

.dots span{
    width:12px;
    height:12px;
    border-radius:50%;
    background:rgba(255,255,255,.4);
    cursor:pointer;
    transition:.3s;
}

.dots span.active{
    background:#ffeb3b;
    transform:scale(1.3);
    box-shadow:0 0 10px rgba(255,235,59,.8);
}

/* ===== VIDEO ===== */
iframe{
    width:100%;
    height:380px;
    border-radius:16px;
    border:none;
    box-shadow:0 15px 35px rgba(0,0,0,.25);
}
.playlist-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:22px;
    margin-top:25px;
}

.video-card{
    background:#fff;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 12px 30px rgba(0,0,0,.25);
    transition:.4s;
}

.video-card:hover{
    transform:translateY(-6px);
}

.video-frame{
    position:relative;
    padding-top:56.25%; 
}

.video-frame iframe{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border:0;
}

.video-info{
    padding:14px 16px;
}

.video-info h3{
    font-size:16px;
    margin:0 0 6px;
    color:#0d47a1;
}

.video-info p{
    font-size:13px;
    color:#555;
}

/* ===== MOBILE ===== */
@media(max-width:600px){
    .section{
        padding:22px;
    }
    .video-info h3{
        font-size:15px;
    }
}
/* ===== FOOTER ===== */
footer{
    background:linear-gradient(90deg,#0d47a1,#1976d2);
    color:#e3f2fd;
    text-align:center;
    padding:14px;
    margin-top:auto;
    box-shadow:0 -6px 18px rgba(0,0,0,.35);
}
</style>
</head>

<body onload="
document.body.classList.add('loaded');
showSection('info',document.querySelector('.submenu button'));
">

<header>
    <h1><i class="fa-solid fa-photo-video"></i> Media Gallery</h1>
    <a href="index.html" class="back-home">← Back to Home</a>
</header>

<!-- SUB MENU -->
<div class="submenu">
    <button class="active" onclick="showSection('info',this)">
        <i class="fa-solid fa-chart-simple"></i> Infographics
    </button>
    <button onclick="showSection('poster',this)">
        <i class="fa-solid fa-bullhorn"></i> Awareness Posters
    </button>
    <button onclick="showSection('video',this)">
        <i class="fa-solid fa-video"></i> Videos / Tutorials
    </button>
</div>

<!-- INFOGRAPHICS -->
<div id="info" class="section">
    <h2>Infographics</h2>
    <div class="slideshow">
        <img src="i1.png" class="slide active">
        <img src="i2.png" class="slide">
        <img src="i3.png" class="slide">
        <img src="i4.png" class="slide">
        <img src="i5.png" class="slide">
        <img src="i6.png" class="slide">
        <div class="dots"></div>
    </div>
</div>

<!-- POSTERS -->
<div id="poster" class="section">
    <h2>Awareness Posters</h2>
    <div class="slideshow">
        <img src="a1.png" class="slide active">
        <img src="a2.jpg" class="slide">
        <img src="a3.png" class="slide">
        <img src="a4.jpeg" class="slide">
        <img src="a5.jpg" class="slide">
        <div class="dots"></div>
    </div>
</div>

<!-- VIDEOS -->
<div id="video" class="section">
    <h2>Videos & Tutorials – Read Light</h2>

    <div class="playlist-grid">

      <iframe 
    width="100%" 
    height="315"
    src="https://www.youtube.com/embed/videoseries?list=PL8UH_9VXawy6YrYdT2gtWO7Eb3gsLUKnC"
    title="YouTube playlist"         
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
    allowfullscreen>
</iframe>

        </div>

    </div>


<footer>
    © 2026 Read Right | Student Awareness Project
</footer>

<script>
const slideshows = [];

function showSection(id,btn){
    document.querySelectorAll('.section').forEach(s=>{
        s.style.display='none';
        s.classList.remove('pop');
    });

    const target=document.getElementById(id);
    target.style.display='block';
    target.classList.add('pop');

    document.querySelectorAll('.submenu button')
        .forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');

    slideshows.forEach(obj=>{
    obj.stop();     
    obj.reset();    

    if(obj.slideshow.closest('.section') === target){
        obj.start(); 
    }
});

    window.scrollTo({top:0,behavior:'smooth'});
}

/* ===== SLIDESHOW INIT (ONLY ONCE) ===== */
document.querySelectorAll('.slideshow').forEach(slideshow=>{
    const slides = slideshow.querySelectorAll('.slide');
    const dotsContainer = slideshow.querySelector('.dots');
    let index = 0;
    let timer;

    slides.forEach((_,i)=>{
        const dot = document.createElement('span');
        if(i===0) dot.classList.add('active');
        dot.addEventListener('click',()=>{
            index=i;
            showSlide();
            restart();
        });
        dotsContainer.appendChild(dot);
    });

    const dots = dotsContainer.querySelectorAll('span');

    function showSlide(){
        slides.forEach(s=>s.classList.remove('active'));
        dots.forEach(d=>d.classList.remove('active'));
        slides[index].classList.add('active');
        dots[index].classList.add('active');
    }

    function start(){
        timer=setInterval(()=>{
            index=(index+1)%slides.length;
            showSlide();
        },1500);
    }

    function stop(){
        clearInterval(timer);
    }

    function restart(){
        stop();
        start();
    }

    start();

    slideshow.addEventListener('mouseenter',stop);
    slideshow.addEventListener('mouseleave',start);

    slideshows.push({
        slideshow,
        start,
        stop,
        reset:()=>{
            index=0;
            showSlide();
        }
    });
});
</script>

</body>
</html>
