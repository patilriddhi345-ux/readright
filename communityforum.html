<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Community Forum – Read Right</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

/* ===== HTML + BODY ===== */
html, body{height:100%}

body{
    margin:0;
    font-family:"Segoe UI", Arial, sans-serif;
    background:
      linear-gradient(rgba(227,242,253,0.8),rgba(95,111,128,0.8)),
      url("https://images.unsplash.com/photo-1507842217343-583bb7270b66");
    background-size:cover;
    background-attachment:fixed;
    animation:bgMove 18s ease-in-out infinite;

    display:flex;
    flex-direction:column;
}

/* BACKGROUND ANIMATION */
@keyframes bgMove{
    0%{background-position:0% 0%}
    50%{background-position:50% 50%}
    100%{background-position:100% 100%}
}

/* ===== HEADER ===== */
header{
    background:linear-gradient(90deg,#0d47a1,#1976d2);
    color:white;
    text-align:center;
    padding:22px 15px 30px;
    box-shadow:0 6px 20px rgba(0,0,0,.25);
}

h1{
    font-family:'Cinzel', serif;
    font-size:36px;
    background:linear-gradient(90deg,#b6a3bb,#37d39f,#1976d2);
    background-size:300% auto;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:headingShift 6s linear infinite;
}

@keyframes headingShift{
    0%{background-position:0%}
    100%{background-position:300%}
}

.back-home{
    display:inline-block;
    margin-top:6px;
    color:#ffeb3b;
    text-decoration:none;
    font-weight:bold;
    transition:.3s;
}
.back-home:hover{transform:translateX(-6px)}

main{flex:1 0 auto}

/* ===== CONTAINER ===== */
.container{
    max-width:900px;
    margin:40px auto;
    padding:35px;
    background:rgba(255,255,255,.88);
    border-radius:22px;
    box-shadow:0 35px 60px rgba(0,0,0,.35);
}

h2{
    color:#0d47a1;
    margin-bottom:10px;
}

/* ===== BLOG BOX ===== */
.blog-box{
    border-left:6px solid #1976d2;
    margin-top:25px;
    animation:pop .6s ease;
    width:100%;
    max-width:1000px;
    margin:0 auto;
    padding:15px;
    background:#ffffff;
    border-radius:16px;
    box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

/* ===== RESPONSIVE IFRAME ===== */
.blog-box iframe{
    width:100%;
    height:75vh;
    min-height:500px;
    border:none;
    border-radius:12px;
}

/* ===== MOBILE OPTIMIZATION ===== */
@media (max-width:768px){
    .container{padding:20px}
    .blog-box iframe{height:80vh}
    h1{font-size:28px}
}

/* ===== ANIMATION ===== */
@keyframes pop{
    from{opacity:0;transform:translateY(-15px)}
    to{opacity:1;transform:translateY(0)}
}

/* ===== FOOTER ===== */
footer{
    background:linear-gradient(90deg,#0d47a1,#1976d2);
    color:#e3f2fd;
    text-align:center;
    padding:14px 10px;
    font-size:.9rem;
    box-shadow:0 -6px 18px rgba(0,0,0,.35);
}
</style>
</head>

<body>

<header>
    <h1><i class="fa-solid fa-comments"></i> Community Forum</h1>
    <a href="index.html" class="back-home">← Back to Home</a>
</header>

<main>

<div class="container">

    <h2><i class="fa-solid fa-users"></i> Community Discussion</h2>
    <p>Explore verified articles and student awareness blogs related to digital and printed reading.</p>

    <!-- BLOG EMBED -->
    <div class="blog-box">
        <iframe 
            src="https://riddhicepreadright.blogspot.com/2026/02/read-rightstudent-awareness-on-digital.html"
            loading="lazy">
        </iframe>
    </div>

</div>

</main>

<footer>
    © 2026 Read Right | Student Awareness Project
</footer>

</body>
</html>
